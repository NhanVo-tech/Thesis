[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_filters = time

build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-I include

; Anchor UART pins (GPIO20=RX, GPIO21=TX)
	-D ANCHOR_UART_RX=20
	-D ANCHOR_UART_TX=21
	-D ANCHOR_UART_BAUD=115200

; Anchor ID (override per-board: 0, 1, 2)
	-D ANCHOR_ID=0

; Master ESP32 MAC (run master, read serial, fill in below)
; Same for all 3 anchors
	-D MASTER_MAC_0=0x10 -D MASTER_MAC_1=0x20 -D MASTER_MAC_2=0xBA -D MASTER_MAC_3=0x73 -D MASTER_MAC_4=0x6E -D MASTER_MAC_5=0xD8
